# Yayımlanan her sürümün kurulum dosyasını VirusTotal'a yükler ve sürüm notlarına tarama bağlantısını ekler.
# Gerekli: depo ayarlarında VT_API_KEY sırrı (virustotal.com hesabı > API key; ücretsiz anahtar yeterli).
# Eski bir sürümü taramak için: Actions > VirusTotal > Run workflow > etiket (ör. v2.1.0).
name: VirusTotal

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Taranacak sürüm etiketi (ör. v2.1.0)
        required: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Kurulum dosyasını indir
        run: |
          [ -n "$VT_API_KEY" ] || { echo "::error::VT_API_KEY sırrı tanımlı değil"; exit 1; }
          mkdir assets
          gh release download "$TAG" --pattern 'FCUK-Control-Center-Setup-*.exe' --dir assets

      - name: VirusTotal'a yükle
        run: |
          : > links.md
          for f in assets/*.exe; do
            name=$(basename "$f")
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            # 32 MB üstü dosyalar için tek kullanımlık yükleme adresi gerekir
            url=$(curl -fsS -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
            curl -fsS -H "x-apikey: $VT_API_KEY" -F "file=@$f" "$url" > /dev/null
            echo "$name -> https://www.virustotal.com/gui/file/$sha"
            echo "**VirusTotal** taraması: [$name](https://www.virustotal.com/gui/file/$sha)" >> links.md
          done

      - name: Sürüm notlarına ekle
        run: |
          gh release view "$TAG" --json body -q .body > body.md
          # Yeniden çalıştırılırsa eski VirusTotal satırı değiştirilir, çoğaltılmaz
          grep -v '^\*\*VirusTotal\*\*' body.md > new.md || true
          printf '\n' >> new.md
          cat links.md >> new.md
          gh release edit "$TAG" --notes-file new.md
