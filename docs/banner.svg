  <rect width="1280" height="320" rx="22" fill="url(#glow1)"/>
  <rect width="1280" height="320" rx="22" fill="url(#glow2)"/>
  <path d="M700 250 C760 250 770 190 830 200 S 900 130 960 150 S 1040 80 1100 110 S 1190 60 1250 70"
