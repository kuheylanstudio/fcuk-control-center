<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="FCUK Control Center">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset=".35" stop-color="#7c5cff"/>
      <stop offset=".7" stop-color="#ff3d81"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".12" cy=".1" r=".6">
